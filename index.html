    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @keyframes pulse-blue {
            0%, 100% { box-shadow: 0 0 15px rgba(37, 211, 102, 0.4), 0 0 30px rgba(0, 136, 204, 0.2); }
            50% { box-shadow: 0 0 25px rgba(0, 136, 204, 0.7), 0 0 50px rgba(0, 136, 204, 0.4); }
        }

            animation: pulse-blue 2s infinite ease-in-out;
        }

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-gold-500 selection:text-slate-950 font-sans antialiased overflow-x-hidden">

    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-gold-600/10 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
    </div>

    <header class="relative z-10 w-full pt-6 px-4 max-w-md mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
            <span class="text-xs font-semibold tracking-wider uppercase text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-2.5 py-1 rounded-full">Live Channel</span>
        </div>
        <div class="text-xs font-medium text-slate-400 bg-slate-900/80 border border-slate-800 px-3 py-1 rounded-full">
            Verified VIP 👑
        </div>
    </header>

    <main class="relative z-10 flex-grow flex flex-col items-center justify-center px-4 py-8 max-w-md mx-auto w-full text-center">
        
        <!-- Channel Logo Badge -->
        <div class="relative mb-6 group">
            <div class="absolute -inset-1 bg-gradient-to-r from-gold-500 to-amber-600 rounded-full blur-md opacity-75 group-hover:opacity-100 transition duration-1000"></div>
            <div class="relative w-28 h-28 bg-slate-900 border-2 border-gold-500/50 rounded-full flex items-center justify-center shadow-2xl">
                <span class="text-4xl">🎯</span>
            </div>
        </div>

        <!-- Channel Title -->
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">
            DP <span class="text-transparent bg-clip-text bg-gradient-to-r from-gold-400 via-amber-300 to-gold-500">BOSS</span>
        </h1>
        <p class="text-sm font-medium text-gold-400/90 tracking-wide uppercase mb-6">
            Elite Predictions & Market Insights
        </p>

        <!-- Value Proposition Cards -->
        <div class="grid grid-cols-3 gap-2.5 w-full mb-8">
            <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-3 backdrop-blur-sm">
                <div class="text-gold-400 font-bold text-lg mb-0.5">99%</div>
                <div class="text-[11px] text-slate-400 font-medium leading-tight">Accuracy Rate</div>
            </div>
            <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-3 backdrop-blur-sm">
                <div class="text-gold-400 font-bold text-lg mb-0.5">50K+</div>
                <div class="text-[11px] text-slate-400 font-medium leading-tight">Active Members</div>
            </div>
            <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-3 backdrop-blur-sm">
                <div class="text-gold-400 font-bold text-lg mb-0.5">FREE</div>
                <div class="text-[11px] text-slate-400 font-medium leading-tight">Daily Tips</div>
            </div>
        </div>

        <div class="w-full space-y-4">
            <!-- Main Telegram Button (Telegram Blue Styling) -->
            <a href="https://t.me/+PaxsCR3InwE2ZjFl" id="telegramBtn" class="w-full relative group block overflow-hidden rounded-2xl p-[2px] focus:outline-none">
                <div class="absolute inset-0 bg-gradient-to-r from-sky-400 via-blue-500 to-sky-600 rounded-2xl glow-telegram"></div>
                <div class="relative bg-gradient-to-r from-[#229ED9] to-[#1785B6] hover:from-[#2090C5] hover:to-[#1578A4] text-white font-bold py-4 px-6 rounded-2xl flex items-center justify-center space-x-3 transition-all duration-300 shadow-xl">
                    <svg class="w-6 h-6 fill-current text-white" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.38-.27-2.06-.49-.83-.27-1.49-.42-1.43-.88.03-.24.37-.49 1.02-.75 3.99-1.74 6.65-2.89 7.98-3.45 3.8-1.58 4.59-1.85 5.1-1.86.11 0 .37.03.54.17.14.12.18.28.2.4v.05z"/>
                    </svg>
                    <span class="text-base tracking-wide font-extrabold">JOIN TELEGRAM CHANNEL</span>
                </div>
            </a>

            <!-- Redirect Status & Cancel Box -->
            <div id="redirectBox" class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 backdrop-blur-sm shadow-lg transition-all duration-300">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs text-slate-300 font-medium flex items-center space-x-1.5">
                        <svg class="w-4 h-4 text-gold-400 animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span id="statusText">Redirecting automatically in <strong id="countdown" class="text-gold-400">5</strong>s...</span>
                    </span>
                    <button id="cancelBtn" onclick="cancelRedirection()" class="text-xs text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 px-2.5 py-1 rounded-lg transition-colors font-medium">
                        Cancel
                    </button>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                    <div id="progressBar" class="bg-gradient-to-r from-gold-500 to-amber-400 h-full w-full transition-all duration-1000 ease-linear"></div>
                </div>
            </div>
        </div>

    </main>

    <footer class="relative z-10 w-full py-4 text-center text-xs text-slate-500 border-t border-slate-900">
        <p>&copy; 2026 DP BOSS Official. All rights reserved.</p>
    </footer>

    <script>
        const TELEGRAM_URL = "https://t.me/+PaxsCR3InwE2ZjFl"; 
        let timeLeft = 5;
        const countdownEl = document.getElementById("countdown");
        const progressBarEl = document.getElementById("progressBar");
        const redirectBoxEl = document.getElementById("redirectBox");
        const statusTextEl = document.getElementById("statusText");
        const cancelBtnEl = document.getElementById("cancelBtn");
        
        let isCancelled = false;

        // Update progress bar width dynamically per second
        const timer = setInterval(() => {
            if (isCancelled) return;

            timeLeft--;
            if (countdownEl) {
                countdownEl.textContent = timeLeft;
            }

            // Calculate progress percentage
            const percentage = (timeLeft / 5) * 100;
            if (progressBarEl) {
                progressBarEl.style.width = `${percentage}%`;
            }

            if (timeLeft <= 0) {
                clearInterval(timer);
                if (!isCancelled) {
                    window.location.href = TELEGRAM_URL;
                }
            }
        }, 1000);

        function cancelRedirection() {
            isCancelled = true;
            clearInterval(timer);
            
            // Transform redirect box to indicate cancellation
            if (redirectBoxEl) {
                redirectBoxEl.style.borderColor = "rgba(234, 179, 8, 0.3)";
                statusTextEl.innerHTML = "<span class='text-gold-400 font-semibold'>Auto-redirect cancelled.</span> Click above to join manually.";
                cancelBtnEl.style.display = "none";
                if (progressBarEl) {
                    progressBarEl.style.width = "0%";
                    progressBarEl.className = "bg-slate-700 h-full w-full";
                }
            }
        }
    </script>
</body>
</html>
